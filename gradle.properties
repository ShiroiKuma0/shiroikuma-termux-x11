org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true
android.enableR8.fullMode=true

### shiroikuma-termux-x11 fork ###
# Our N: versionName = "1.03.01+<base date>.<HH-MM>.g<sha8>+<NNN>", versionCode = 15 * 10000 + N
# (upstream's literals are read from lorie/version.gradle and lorie-app/build.gradle, never edited).
# Bumped by the `buildFork` task after every successful build. It runs MONOTONICALLY and is reset to
# 1 ONLY if upstream's own versionCode ever moves — never merely because a sync moved the .g<sha>
# pin: an installer compares versionCode alone. buildFork enforces this against
# LAST_BUILT_VERSION_CODE below.
BUILD_NUMBER=3

# Highest versionCode this repo has ever built; buildFork refuses to go at or below it.
LAST_BUILT_VERSION_CODE=150002
